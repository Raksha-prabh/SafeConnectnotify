<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SafeConnect Notify</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:#111827;
            font-family:'Poppins',sans-serif;
            min-height:100vh;
        }

        .auth-card{
            border:none;
            border-radius:20px;
            overflow:hidden;
            background:#1E293B;
            box-shadow:0 20px 45px rgba(0,0,0,.45);
        }

        .left-panel{
            background:#0F172A;
            color:white;
            padding:50px 40px;
            text-align:center;
        }

        .left-panel i{
            font-size:75px;
            color:#38BDF8;
        }

        .left-panel h2{
            color:#38BDF8;
            font-weight:700;
        }

        .left-panel p{
            color:#CBD5E1;
            font-size:16px;
        }

        .feature-list{
            text-align:left;
            margin-top:25px;
            line-height:2;
            font-size:16px;
        }

        .right-panel{
            background:#1E293B;
            color:white;
            padding:45px;
        }

        .right-panel h3,
        .right-panel h4{
            color:white;
            font-weight:700;
        }

        .form-control{
            height:50px;
            border-radius:12px;
            background:#334155;
            border:1px solid #475569;
            color:white;
        }

        .form-control::placeholder{
            color:#CBD5E1;
        }

        .form-control:focus{
            background:#334155;
            color:white;
            border-color:#38BDF8;
            box-shadow:0 0 0 .25rem rgba(56,189,248,.25);
        }

        .btn-primary{
            background:#0EA5E9;
            border:none;
            border-radius:12px;
            font-weight:600;
            height:48px;
        }

        .btn-primary:hover{
            background:#0284C7;
        }

        .btn-success{
            background:#10B981;
            border:none;
            border-radius:12px;
            font-weight:600;
            height:48px;
        }

        .btn-success:hover{
            background:#059669;
        }

        hr{
            border-color:#475569;
            margin:30px 0;
        }

    </style>

</head>

<body>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-10">

<div class="card auth-card">

<div class="row g-0">

<!-- LEFT PANEL -->

<div class="col-md-5 left-panel d-flex flex-column justify-content-center">

<i class="bi bi-shield-lock-fill"></i>

<h2 class="mt-4">

SafeConnect Notify

</h2>

<p class="mt-3">

AI-Powered Social Media Security System

</p>

<div class="feature-list">

<p>🛡 AI Profile Analysis</p>

<p>👤 Fake Account Detection</p>

<p>🤝 Friend Request Checker</p>

<p>💬 AI Scam Chat Analyzer</p>

<p>📊 Security Dashboard</p>

</div>

</div>

<!-- RIGHT PANEL -->

<div class="col-md-7">

<div class="right-panel">

<h3 class="text-center mb-4">

<i class="bi bi-box-arrow-in-right text-info"></i>

Login

</h3>

<form method="POST" action="/login">

<input
type="email"
name="email"
class="form-control mb-3"
placeholder="Email Address"
required>

<input
type="password"
name="password"
class="form-control mb-3"
placeholder="Password"
required>

<button class="btn btn-primary w-100">

<i class="bi bi-box-arrow-in-right"></i>

Login

</button>

</form>

<hr>

<h4 class="text-center mb-4">

<i class="bi bi-person-plus-fill text-success"></i>

Create Account

</h4>

<form method="POST" action="/register">

<input
type="text"
name="name"
class="form-control mb-3"
placeholder="Full Name"
required>

<input
type="email"
name="email"
class="form-control mb-3"
placeholder="Email Address"
required>

<input
type="password"
name="password"
class="form-control mb-3"
placeholder="Password"
required>

<button class="btn btn-success w-100">

<i class="bi bi-person-plus-fill"></i>

Register

</button>

</form>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
